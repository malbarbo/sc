[package]
name = "scload"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasmparser = "0.254"
# the shims and stubs (Loader::wasi_shim, Loader::stubs); wasmtime's
# compiler already has this version
wasm-encoder = "0.254"
cpp_demangle = "0.5"
# the minimal set (PLANO-REPL.md §5.3). gc turns on the exceptions; gc-drc
# is the one collector. wasmtime-wasi's p1 brings p2, so async and
# component-model come back with it
wasmtime = { version = "48.0.3", default-features = false, features = ["runtime", "std", "cranelift", "gc", "gc-drc", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "48.0.3", default-features = false, features = ["p1"] }
# a frame's file and line ([Loader::symbols]), the versions wasmtime uses
addr2line = { version = "0.26", default-features = false, features = ["std"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std", "endian-reader"] }
# sc, the REPL: the engine's child protocol (bindgen, so libclang), the
# command line, the prompt. scload builds without them
sc-proto = { path = "../proto", optional = true }
bpaf = { version = "0.9", features = ["derive", "bright-color"], optional = true }
rustyline = { version = "18", features = ["derive", "custom-bindings"], optional = true }
dirs = { version = "6", optional = true }
libc = { version = "0.2", optional = true }

# make test-loader (tests/loader.rs)
[dev-dependencies]
wat = "=1.254.0"
libc = "0.2"

[features]
repl = ["dep:sc-proto", "dep:bpaf", "dep:rustyline", "dep:dirs", "dep:libc"]

[[bin]]
name = "sc"
path = "src/bin/sc/main.rs"
required-features = ["repl"]

# make loader and repl, for the batteries: quick to build
[profile.release]
debug = false

# make dist, the binaries that ship (ANALISE.md §49): lto and strip take
# scload from 24 MB to 10 MB. "s" compiles the libraries as fast as 3, "z"
# is slower. No code catches a panic
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
