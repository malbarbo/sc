[package]
name = "sc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasmparser = "0.254"
# the shims and stubs (Loader::wasi_shim, Loader::stubs); wasmtime's
# compiler already has this version
wasm-encoder = "0.254"
cpp_demangle = "0.5"
# the minimal set (docs/plan-repl.md §5.3). gc turns on the exceptions; gc-drc
# is the one collector. wasmtime-wasi's p1 brings p2, so async and
# component-model come back with it
# (the native feature: the loader's runtime in sc and scload)
wasmtime = { version = "48.0.3", default-features = false, features = ["runtime", "std", "cranelift", "gc", "gc-drc", "parallel-compilation"], optional = true }
wasmtime-wasi = { version = "48.0.3", default-features = false, features = ["p1"], optional = true }
# a frame's file and line ([loader::Loader::symbols]), the versions wasmtime
# uses
addr2line = { version = "0.26", default-features = false, features = ["std"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std", "endian-reader"] }
# sc, the REPL: the command line, the prompt. scload builds without them
bpaf = { version = "0.9", features = ["derive", "bright-color"], optional = true }
rustyline = { version = "18", features = ["derive", "custom-bindings"], optional = true }
dirs = { version = "6", optional = true }
# the pack sc embeds (src/bin/sc/pack.rs), which build.rs writes
backhand = { version = "0.25.5", default-features = false, features = ["zstd"], optional = true }
# Ctrl-C (the loader)
libc = "0.2"
# sc.wasm's .cwasm, which build.rs compresses (src/engine/guest.rs)
zstd = { version = "0.13", optional = true }

# Ctrl-C on Windows (src/loader/native/ctrl_c.rs), the version rustyline has
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"], optional = true }

# the bindings of engine/sc.h; the pack sc embeds (build.rs), with the
# libraries and sc.wasm compiled by the wasmtime of the loader, with its
# features
[build-dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"], optional = true }
backhand = { version = "0.25.5", default-features = false, features = ["zstd"], optional = true }
wasmtime = { version = "48.0.3", default-features = false, features = ["runtime", "std", "cranelift", "gc", "gc-drc", "parallel-compilation"], optional = true }
zstd = { version = "0.13", features = ["zstdmt"], optional = true }

# make test-loader and test-proto (tests/)
[dev-dependencies]
wat = "=1.254.0"

[features]
default = ["engine"]
# the loader on wasmtime (src/loader/native.rs): scload, and sc with the
# engine. Without it the loader is its core, which sc.wasm links (wasm/)
native = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:windows-sys"]
# the engine's API (the bindings of engine/sc.h) and the machine, which
# sc.wasm links too (wasm/)
machine = ["dep:bindgen"]
# sc: the machine, with sc.wasm's session on wasmtime as the compiler
# (src/engine/guest.rs, NOTES.md §68), which build.rs embeds; build.rs
# asks make for it
engine = ["native", "machine", "dep:backhand", "dep:wasmtime", "dep:zstd", "dep:bpaf", "dep:rustyline", "dep:dirs"]

[[bin]]
name = "sc"
path = "src/bin/sc/main.rs"
required-features = ["engine"]

[[bin]]
name = "scload"
path = "src/bin/scload.rs"
required-features = ["native"]

[[test]]
name = "session"
required-features = ["engine"]

[[test]]
name = "signal"
required-features = ["native"]

[[test]]
name = "exceptions"
required-features = ["native"]

[[test]]
name = "undo"
required-features = ["native"]


# make loader and repl, for the batteries: quick to build
[profile.release]
debug = false

# build.rs compresses the pack with zstd -19: 63 s in opt-level 0, the
# default of what builds the build scripts
[profile.dev.build-override]
opt-level = 2
[profile.release.build-override]
opt-level = 2

# make dist, the binaries that ship (NOTES.md §49): lto and strip take
# scload from 24 MB to 10 MB. "s" compiles the libraries as fast as 3, "z"
# is slower. No code catches a panic
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
