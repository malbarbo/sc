[package]
name = "sc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasmparser = "0.254"
# the shims and stubs (Loader::wasi_shim, Loader::stubs); wasmtime's
# compiler already has this version
wasm-encoder = "0.254"
cpp_demangle = "0.5"
# the minimal set (PLANO-REPL.md §5.3). gc turns on the exceptions; gc-drc
# is the one collector. wasmtime-wasi's p1 brings p2, so async and
# component-model come back with it
wasmtime = { version = "48.0.3", default-features = false, features = ["runtime", "std", "cranelift", "gc", "gc-drc", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "48.0.3", default-features = false, features = ["p1"] }
# a frame's file and line ([loader::Loader::symbols]), the versions wasmtime
# uses
addr2line = { version = "0.26", default-features = false, features = ["std"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std", "endian-reader"] }
# sc, the REPL: the command line, the prompt. scload builds without them
bpaf = { version = "0.9", features = ["derive", "bright-color"], optional = true }
rustyline = { version = "18", features = ["derive", "custom-bindings"], optional = true }
dirs = { version = "6", optional = true }
# Ctrl-C (the loader), the child's signals and pipes (the engine)
libc = "0.2"
# the wasm feature: WASI of sc.wasm's sessions
tokio = { version = "1", features = ["rt"], optional = true }

# the bindings of engine/sc.h
[build-dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"], optional = true }

# make test-loader and test-proto (tests/)
[dev-dependencies]
wat = "=1.254.0"

[features]
default = ["engine"]
# sc, with the engine linked in (PLANO-REPL.md §1.1): build.rs links the
# arguments of SC_LINK_ARGS, by default build/link-session-cut/engine.args,
# which it asks make for
engine = ["dep:bindgen", "dep:bpaf", "dep:rustyline", "dep:dirs"]
# the same API over sc.wasm's exports through wasmtime (src/engine/wasm.rs),
# in place of the linked engine: build/sc-engine-wasm (PLANO-REPL.md §5.2)
wasm = ["engine", "dep:tokio"]

[[bin]]
name = "sc"
path = "src/bin/sc/main.rs"
required-features = ["engine"]

[[test]]
name = "session"
required-features = ["engine"]


# make loader and repl, for the batteries: quick to build
[profile.release]
debug = false

# make dist, the binaries that ship (ANALISE.md §49): lto and strip take
# scload from 24 MB to 10 MB. "s" compiles the libraries as fast as 3, "z"
# is slower. No code catches a panic
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
